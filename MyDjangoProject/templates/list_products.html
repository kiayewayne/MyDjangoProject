<h1>All Products</h1>
<ul>
    {% for product in products %}
        <li>
            <strong>{{ product.name }}</strong><br>
            Price: ${{ product.price }}<br>
            Category: {{ product.category.name }}<br>
            {% if product.image %}
                <img src="{{ product.image.url }}" width="100">
            {% endif %}
        </li>
    {% empty %}
        <li>No products available.</li>
    {% endfor %}
</ul>
